name: Playwright Tests
on:
  push:
    branches: [main]
# Read-only token by default; only the deploy-report job gets write permissions.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_DATABASE: ${{ secrets.DB_NAME }}
          MYSQL_USER: ${{ secrets.DB_USER }}
          MYSQL_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout MyPracticeProject
        uses: actions/checkout@v4
        with:
          repository: Abidchauhan/MyPracticeProject
          path: MyPracticeProject
          token: ${{ secrets.MYPRACTICEPROJECT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install backend dependencies
        working-directory: MyPracticeProject/backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: MyPracticeProject/frontend
        run: npm install

      - name: Run database migrations
        working-directory: MyPracticeProject/backend
        run: npm run db:migrate
        env: &backend-env
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.JWT_EXPIRES_IN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Seed database
        working-directory: MyPracticeProject/backend
        run: npm run db:seed
        env: *backend-env

      - name: Seed admin user
        working-directory: MyPracticeProject/backend
        run: |
          node -e "
          const mysql = require('mysql2/promise');
          (async () => {
            const conn = await mysql.createConnection({
              host: process.env.DB_HOST,
              user: process.env.DB_USER,
              password: process.env.DB_PASSWORD,
              database: process.env.DB_NAME,
            });
            await conn.execute(
              'INSERT INTO users (mobile, role) VALUES (?, ?) ON DUPLICATE KEY UPDATE role = ?',
              ['9123456780', 'admin', 'admin'],
            );
            await conn.end();
            console.log('Admin user 9123456780 ready');
          })().catch((err) => { console.error(err.message); process.exit(1); });
          "
        env: *backend-env

      - name: Start backend
        working-directory: MyPracticeProject/backend
        run: nohup node server.js > backend.log 2>&1 &
        env: *backend-env

      - name: Start frontend
        working-directory: MyPracticeProject/frontend
        run: nohup npm run dev > frontend.log 2>&1 &

      - name: Wait for backend and frontend to be ready
        run: npx wait-on http://localhost:5000/api/products http://localhost:5173 --timeout 60000

      - name: Run Playwright tests
        run: npx playwright test

      # Feeds the Allure Trend widgets. The first run finds no published report (404),
      # keeps no files, and the report is generated without history.
      - name: Restore Allure history from the published report
        if: ${{ !cancelled() }}
        env:
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            curl -fsSL "$REPORT_URL/history/$f" -o "allure-results/history/$f" || rm -f "allure-results/history/$f"
          done
          ls -la allure-results/history

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # The public Pages copy drops Playwright traces (.zip attachments): they record network
      # traffic, including auth tokens and OTP responses. The artifact above keeps them.
      - name: Prepare Pages copy of the report without traces
        if: ${{ !cancelled() }}
        run: |
          rm -rf allure-pages
          cp -r allure-report allure-pages
          find allure-pages -path '*/data/attachments/*.zip' -print -delete

      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-pages

  deploy-report:
    needs: test
    # Publish even when tests failed; skip only if the run was cancelled.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      pages: write      # create the Pages deployment
      id-token: write   # OIDC token proving the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
